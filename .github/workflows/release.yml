name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v2.1.0-b8)'
        required: true
        default: 'v2.0.0-b7'
      release_title:
        description: 'Release Title (例如 KM 桌面行事曆小工具 v2.1.0)'
        required: true
        default: 'KM 桌面行事曆小工具 v2.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.CALWIDGET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > km-calwidget-release.jks
          fi

      - name: Build Signed Release APK
        env:
          CALWIDGET_STORE_PASS: ${{ secrets.CALWIDGET_STORE_PASS }}
          CALWIDGET_KEY_ALIAS: ${{ secrets.CALWIDGET_KEY_ALIAS }}
          CALWIDGET_KEY_PASS: ${{ secrets.CALWIDGET_KEY_PASS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk KM_calendar-widget.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${TAG%-b*}"
          TITLE="${{ github.event.inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            TITLE="KM 桌面行事曆小工具 ${CLEAN_VER}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" KM_calendar-widget.apk --clobber
          elif [ -f RELEASE_NOTES.md ]; then
            gh release create "$TAG" KM_calendar-widget.apk \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" KM_calendar-widget.apk \
              --title "$TITLE" \
              --generate-notes
          fi
